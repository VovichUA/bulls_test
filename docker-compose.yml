services:
  nginx:
    image: nginx:stable-alpine
    container_name: bulls_nginx
    ports:
      - "8082:80"
    volumes:
      - ./src:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - bulls_network

  php:
    build:
      context: ./.docker/php
      dockerfile: Dockerfile
    container_name: bulls_php
    volumes:
      - ./src:/var/www/html
    environment:
      PHP_IDE_CONFIG: "serverName=bulls"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bulls_network

  mysql:
    image: mysql:8.4
    container_name: bulls_mysql
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: bulls
      MYSQL_USER: bulls
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - bulls_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - bulls_network

networks:
  bulls_network:
    driver: bridge

volumes:
  bulls_mysql_data:
