[program:bulls-sheets-worker]
command=/bin/sh /var/www/bulls/deploy/queue-worker.sh /var/www/bulls/src /usr/bin/php8.4
directory=/var/www/bulls/src
user=bulls
umask=002
numprocs=1
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=660
redirect_stderr=true
stdout_logfile=/var/www/bulls/src/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
